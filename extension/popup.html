<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>D Collector</title>
  <style>
    body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;width:360px;margin:0;padding:14px;background:#0f172a;color:#e5e7eb}
    h1{font-size:18px;margin:0 0 10px}.card{background:#111827;border:1px solid #334155;border-radius:12px;padding:12px;margin:10px 0}
    button{width:100%;padding:10px;border:0;border-radius:10px;margin:5px 0;font-weight:700;cursor:pointer}.primary{background:#22c55e;color:#052e16}.sub{background:#334155;color:#fff}
    input{width:70px;padding:8px;border-radius:8px;border:1px solid #475569;background:#020617;color:#fff}.row{display:flex;gap:8px;align-items:center}
    #status{white-space:pre-wrap;font-size:12px;line-height:1.55;color:#cbd5e1}.sample{font-size:11px;max-height:130px;overflow:auto;background:#020617;border-radius:8px;padding:8px}
    .muted{font-size:11px;color:#94a3b8}
  </style>
</head>
<body>
  <h1>D Collector</h1>
  <div class="card">
    <button id="collect" class="primary">このページを取得</button>
    <button id="sync" class="sub" disabled>取得内容をサイトへ同期</button>
    <div id="status">アナスロの対象ページを開いてから取得してください。</div>
    <div id="sample" class="sample" hidden></div>
  </div>
  <div class="card">
    <div class="row"><label for="days">過去</label><input id="days" type="number" min="1" max="10" value="5"><span>日</span></div>
    <button id="batch" class="sub">現在の日付から連続取得して同期</button>
    <div class="muted">最大10日。各ページを通常表示しながら取得します。制限・認証ページを検出した場合は停止します。</div>
  </div>
  <button id="options" class="sub">GitHub同期設定</button>
  <script src="popup.js"></script>
</body>
</html>
